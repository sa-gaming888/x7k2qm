name: build

# 程式映像：FROM 基底映像（base.yml 建的 x7k2qm-base:latest），只放程式，所以每次建很快。
# 程式改了才跑；基底改了先跑 base，再手動觸發這個。CVE 掃描在本地做（scan.sh），不在這裡。

on:
  push:
    branches: [main]
    paths-ignore: [Dockerfile.base, .github/workflows/base.yml, README.md, scan.sh]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  BASE: ghcr.io/${{ github.repository }}-base:latest

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登入 GHCR（拉基底、推映像）
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 建映像（先載入本機，檢查過才推）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: BASE=${{ env.BASE }}
          tags: ${{ env.IMAGE }}:test

      - name: 自我檢查（不登入）
        run: docker run --rm ${{ env.IMAGE }}:test --check

      - name: 推映像
        if: github.event_name != 'pull_request'
        run: |
          docker tag ${{ env.IMAGE }}:test ${{ env.IMAGE }}:latest
          docker tag ${{ env.IMAGE }}:test ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
