# 練寵劇本（使用者 2026-11-12「五轉人物先加上」：五轉的組停練級，改成只練寵）
# 每隻人物固定負責一種人龍＋一種老虎（使用者 11-12「每一隻人物負責一種老虎及人龍」）：
#   隊伍第 1 隻 人龍 54＋綠虎 307、第 2 隻 481＋310、第 3 隻 57＋紅虎 309、第 4 隻 56＋黃虎 308、第 5 隻 55＋綠虎 307（同 jobs.md 範例）
# 檔差 < 3 練到 120 賣寵物店、≥ 3 練到 1000 分改名「1000」存倉；缺的去抓，戰寵抓到 +3 以上才練、低檔當場放生
# （使用者 11-06「+3 以下練的120 賣給寵物店」、11-11「缺的去抓 要+3 以上才練」）；經驗果沒了自己吃、沒有用石幣買。
# petgoal 一次最多補抓 20 隻（--refill-max 預設），抓滿就正常結束；loop 讓它接著再跑一次。
# 失敗照劇本規則：30 分鐘後自動重做、最多 24 次；送出後對不上（JobHold）才停下來等人。
#
# 用法：容器環境變數 SCENARIO=/app/config/scenarios/petgoal.toml（或 bot.toml 的 files.scenario）。

[scenario]
name = "練寵"
loop = true

[[step]]
name = "五色人龍＋老虎練到目標"
job = "petgoal --apply --pet-id 54,55,56,57,481 --ride-ids 307,308,309,310 --assign 1:54:307,2:481:310,3:57:309,4:56:308,5:55:307 --sell-low --refill --release-low --ride-refill --buy-bait --fruit"
